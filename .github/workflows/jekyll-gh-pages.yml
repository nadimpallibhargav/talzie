name: Talzie

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Use the version required by your project

      - name: Install dependencies
        run: npm install

      - name: Build Next.js project
        run: npm run build

      - name: Export static site
        run: npm run export

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./out  # Ensure this matches your Next.js export directory

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
        with:
          branch: gh-pages  # Ensure this is your deployment branch

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
